name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.pytool/**'
      - 'OpensslPkg/**'
      - 'MbedTlsPkg/**'
      - 'MU_BASECORE/**'
      - '.github/workflows/continuous-integration.yml'
  push:
    branches:
      - main
    paths:
      - '.pytool/**'
      - 'OpensslPkg/**'
      - 'MbedTlsPkg/**'
      - 'MU_BASECORE/**'
      - '.github/workflows/continuous-integration.yml'

env:
  TOOL_CHAIN_TAG: CLANGPDB

jobs:
  crypto-ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/microsoft/mu_devops/ubuntu-24-dev:8b4aa53
    strategy:
      fail-fast: false
      matrix:
        package:
          - OpensslPkg
          - MbedTlsPkg
          - OneCryptoPkg
        target:
          - DEBUG
          - RELEASE
          - NO-TARGET

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pip-requirements.txt

      - name: Setup
        run: stuart_setup -c .pytool/CISettings.py -p ${{ matrix.package }}

      - name: CI setup
        run: stuart_ci_setup -c .pytool/CISettings.py -p ${{ matrix.package }}

      - name: Update
        run: stuart_update -c .pytool/CISettings.py -p ${{ matrix.package }}

      - name: Build ${{ matrix.package }} ${{ matrix.target }} (${{ env.TOOL_CHAIN_TAG }})
        run: stuart_ci_build -c .pytool/CISettings.py -p ${{ matrix.package }} -t ${{ matrix.target }} TOOL_CHAIN_TAG=${{ env.TOOL_CHAIN_TAG }}

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}-${{ env.TOOL_CHAIN_TAG }}-logs
          path: |
            Build/*.txt
            Build/**/*.txt
